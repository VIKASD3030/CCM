<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CCM — AI-powered Correspondence Contract Management Tool for drafting professional responses to client letters.">
    <title>CCM — Correspondence Contract Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div id="app" class="app-container">

        <!-- SIDEBAR -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-icon">
                        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                            <rect width="28" height="28" rx="7" fill="#534AB7"/>
                            <text x="14" y="19" text-anchor="middle" fill="white" font-family="Inter" font-size="15" font-weight="500">C</text>
                        </svg>
                    </div>
                    <span class="logo-text">CCM</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <div class="sidebar-section-title">Workspace</div>

                <a href="#dashboard" class="nav-item active" data-page="dashboard">
                    <i class="ti ti-layout-dashboard"></i>
                    <span>Dashboard</span>
                </a>

                <a href="#letters" class="nav-item" data-page="letters">
                    <i class="ti ti-inbox"></i>
                    <span>Inbox</span>
                    <span id="inbox-badge" class="nav-badge" style="display:none;">0</span>
                </a>

                <a href="#drafting" class="nav-item" data-page="drafting">
                    <i class="ti ti-writing"></i>
                    <span>AI Drafting</span>
                </a>

                <a href="#review" class="nav-item" data-page="review">
                    <i class="ti ti-checkup-list"></i>
                    <span>Review &amp; Approve</span>
                    <span id="review-badge" class="nav-badge" style="display:none;">0</span>
                </a>

                <div class="sidebar-section-title" style="margin-top: 8px;">Config</div>

                <a href="#knowledge" class="nav-item" data-page="knowledge">
                    <i class="ti ti-book-2"></i>
                    <span>Knowledge Base</span>
                </a>

                <a href="#settings" class="nav-item" data-page="settings">
                    <i class="ti ti-settings"></i>
                    <span>Settings</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="system-status">
                    <i class="ti ti-robot"></i>
                    <span style="flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis;">Knower API</span>
                    <div class="status-dot" id="system-status-dot"></div>
                    <span id="system-status-text">Connecting…</span>
                </div>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main id="main-content" class="main-content">

            <!-- Top Bar -->
            <header class="top-bar">
                <div class="top-bar-left">
                    <button id="mobile-menu-btn" class="mobile-menu-btn" aria-label="Open menu">
                        <i class="ti ti-menu-2" style="font-size: 20px;"></i>
                    </button>
                    <h1 id="page-title" class="page-title">Dashboard</h1>
                </div>
                <div class="top-bar-right">
                    <div id="topbar-actions"></div>
                    <span class="topbar-date" id="topbar-date"></span>
                    <div class="user-avatar-chip">AK</div>
                </div>
            </header>

            <!-- Page Content -->
            <div id="page-content" class="page-content">
            </div>
        </main>
    </div>

    <!-- Slide-over Drawer -->
    <div id="slide-over-backdrop" class="slide-over-backdrop"></div>
    <aside id="slide-over" class="slide-over" aria-label="Letter detail">
        <div class="slide-over-header">
            <span id="slide-over-title" class="slide-over-title">Letter Detail</span>
            <button class="btn-ghost btn-sm" id="slide-over-close" onclick="App.closeDrawer()" style="padding: 4px 8px;">
                <i class="ti ti-x" style="font-size: 16px;"></i>
            </button>
        </div>
        <div id="slide-over-body" class="slide-over-body"></div>
        <div id="slide-over-footer" class="slide-over-footer" style="display: none;"></div>
    </aside>

    <!-- Modal -->
    <div id="modal-overlay" class="modal-overlay" style="display:none;" onclick="if(event.target===this) App.closeModal()">
        <div id="modal-content" class="modal-content"></div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <script src="/js/api.js"></script>
    <script src="/js/knowledge.js"></script>
    <script src="/js/letters.js"></script>
    <script src="/js/drafting.js"></script>
    <script src="/js/review.js"></script>
    <script src="/js/settings.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
