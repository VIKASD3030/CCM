<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background: #34a853; color: white; padding: 15px; text-align: center; }
        .content { padding: 20px; }
        .button { display: inline-block; background: #34a853; color: white; padding: 12px 24px; text-decoration: none; border-radius: 4px; }
        .footer { font-size: 12px; color: #666; margin-top: 20px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Draft Approved</h2>
        </div>
        <div class="content">
            <p>Hello,</p>
            <p>Your draft has been approved.</p>
            <p><strong>Letter Subject:</strong> {{ letter_subject }}</p>
            <p><strong>Reviewed by:</strong> {{ reviewer_name }}</p>
            <p><strong>Approved at:</strong> {{ approved_at }}</p>
            <p style="margin-top: 20px;">
                <a href="{{ view_url }}" class="button">View Approved Draft</a>
            </p>
        </div>
        <div class="footer">
            <p>This is an automated notification from CCM.</p>
        </div>
    </div>
</body>
</html>
