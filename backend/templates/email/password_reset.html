<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 560px; margin: 0 auto; padding: 24px; }
        .logo { font-size: 20px; font-weight: 600; color: #534AB7; margin-bottom: 20px; }
        .content { padding: 0; }
        .button { display: inline-block; background: #534AB7; color: white; padding: 12px 28px; text-decoration: none; border-radius: 6px; font-size: 14px; margin: 16px 0; }
        .footer { font-size: 12px; color: #888; margin-top: 24px; border-top: 1px solid #eee; padding-top: 16px; }
        .muted { color: #888; font-size: 13px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">CCM</div>
        <div class="content">
            <h2>Reset your password</h2>
            <p>We received a request to reset the password for your CCM account.</p>
            <p style="text-align:center;">
                <a href="{{ reset_link }}" class="button">Reset Password</a>
            </p>
            <p class="muted">This link expires in 1 hour. If you did not request a password reset, please ignore this email.</p>
        </div>
        <div class="footer">
            <p>CCM — Correspondence Contract Management</p>
        </div>
    </div>
</body>
</html>
