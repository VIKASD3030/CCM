# A single, generic, database configuration file.

[alembic]
script_location = alembic
prepend_sys_path = ..

# Use the synchronous URL for Alembic CLI operations.
# The async URL (postgresql+asyncpg://) is used in env.py for runtime.
sqlalchemy.url = postgresql://ccm:ccm_password@localhost:5432/ccm_db

# Template used to generate migration file names
# Use a simple template to avoid Python 3.14 timezone issues
file_template = %%(rev)s_%%(slug)s

# Timezone for new migration timestamps
; timezone = UTC

# Max length of characters to apply to the "slug" field
truncate_slug_length = 40

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
